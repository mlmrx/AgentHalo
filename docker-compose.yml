version: '3.9'
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: agenthalo
      POSTGRES_PASSWORD: agenthalo
      POSTGRES_DB: agenthalo
    ports:
      - "5432:5432"
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://agenthalo:agenthalo@db:5432/agenthalo
      MOCK_HEALTH_ENDPOINT: http://mock-health:8010/nearest-medical-camp
    ports:
      - "8000:8000"
    depends_on: [db, mock-health]
  web:
    image: nginx:alpine
    volumes:
      - ./apps/web:/usr/share/nginx/html:ro
    ports:
      - "3000:80"
    depends_on: [api]
  mock-health:
    build:
      context: .
      dockerfile: examples/kumbh/Dockerfile
    ports:
      - "8010:8010"
